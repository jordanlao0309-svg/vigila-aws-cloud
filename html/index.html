<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGILA | AWS Cloud Surveillance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="text-xl font-bold tracking-wider text-white">VIGILA <span class="text-xs text-blue-400 font-normal">AWS CLOUD SURVEILLANCE</span></h1>
        </div>
        <div class="text-sm text-slate-400">
            Región: <span class="text-slate-200 font-mono">us-east-2 (Ohio)</span> | Estado: <span class="text-emerald-400 font-semibold">LIVE</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 grid grid-cols-1 md:grid-cols-2 gap-6 max-w-7xl mx-auto w-full">
        <!-- Cam 1 -->
        <div class="bg-slate-900 rounded-xl border border-slate-800 p-4 flex flex-col shadow-xl">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-semibold text-slate-200">CAM-01: Puerta Principal</h2>
                <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 text-xs font-mono rounded border border-emerald-500/30">WebRTC WHEP</span>
            </div>
            <div class="relative bg-black rounded-lg aspect-video overflow-hidden flex items-center justify-center border border-slate-800">
                <!-- Reproductor WHEP/WebRTC -->
                <video id="video-cam1" autoplay controls muted playsinline class="w-full h-full object-cover"></video>
            </div>
        </div>

        <!-- Cam 2 -->
        <div class="bg-slate-900 rounded-xl border border-slate-800 p-4 flex flex-col shadow-xl">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-semibold text-slate-200">CAM-02: Almacén Central</h2>
                <span class="px-2 py-0.5 bg-blue-500/20 text-blue-400 text-xs font-mono rounded border border-blue-500/30">Stream Activo</span>
            </div>
            <div class="relative bg-black rounded-lg aspect-video overflow-hidden flex items-center justify-center border border-slate-800">
                <video id="video-cam2" autoplay controls muted playsinline class="w-full h-full object-cover"></video>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-3 text-center text-xs text-slate-500">
        Proyecto SENATI - Tecnología Cloud con AWS (PIAD-626) | Autor: Jordan Mauricio Lao Guerra
    </footer>
</body>
</html>
